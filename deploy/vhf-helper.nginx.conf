limit_req_zone $binary_remote_addr zone=vhfstats:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vhf.p4e1.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vhf-helper;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vhf.p4e1.ru;

    ssl_certificate     /etc/letsencrypt/live/vhf.p4e1.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vhf.p4e1.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    root /var/www/vhf-helper;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /api/ {
        limit_req zone=vhfstats burst=20 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
